<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUBO Quiz Owl Flight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; font-family: 'Onest', sans-serif; font-weight: 500; }
        h1, h2, h3, h4, .font-black, strong, button, .btn-bubo, .btn-secondary { font-weight: 900 !important; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d021a; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .btn-bubo { background: linear-gradient(135deg, #FE7600 0%, #ff8c1a 100%); box-shadow: 0 4px 22px rgba(254, 118, 0, 0.5); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-bubo:active { transform: scale(0.97); }
        .glass-panel { background: rgba(29, 9, 54, 0.95); backdrop-filter: blur(14px); border: 1px solid rgba(120, 44, 233, 0.55); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .glass-panel-menu { background: rgba(29, 9, 54, 0.65); backdrop-filter: blur(10px); border: 1px solid rgba(120, 44, 233, 0.45); }
    </style>
</head>
<body class="flex items-center justify-center h-full w-full">
    <div id="gameContainer" class="relative w-full h-full max-w-md max-h-[920px] aspect-[9/16] shadow-2xl overflow-hidden flex flex-col justify-between bg-[#140326]">
        
        <!-- Стартовое меню -->
        <div id="startScreen" class="absolute inset-0 z-30 flex flex-col justify-between p-4 bg-[#140326]/40 backdrop-blur-[7px]">
            <div class="pt-8 text-center">
                <h1 class="text-3xl font-black text-[#FE7600]">BUBO GAME</h1>
                <p class="text-xs text-purple-200 mt-1">Соберите 70 тем в полёте!</p>
            </div>
            <div class="space-y-3 my-auto">
                <button id="startBtn" class="btn-bubo w-full py-4 rounded-2xl text-sm uppercase tracking-wider font-black">НАЧАТЬ ПОЛЕТ</button>
            </div>
        </div>

        <!-- Игровой HUD -->
        <div id="topHud" class="hidden absolute top-3 left-3.5 right-3.5 z-20 flex justify-between items-center pointer-events-none">
            <div class="flex items-center space-x-2">
                <div id="scoreBadge" class="h-9 bg-[#1d0936]/90 border border-[#FE7600]/60 px-3 rounded-xl flex items-center space-x-1.5 shadow-lg">
                    <i class="fa-solid fa-circle-question text-[#FE7600] text-xs"></i>
                    <span id="scoreVal" class="text-white text-xs font-black">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" class="w-full h-full"></canvas>

        <div id="gameOverModal" class="hidden absolute inset-0 z-40 flex items-center justify-center p-4 bg-black/80 text-center">
            <div class="glass-panel w-full max-w-xs rounded-3xl p-5 space-y-4">
                <h2 class="text-lg text-white font-black">ЗАБЕГ ОКОНЧЕН</h2>
                <button id="restartBtn" class="btn-bubo w-full py-3 rounded-2xl text-xs font-black">ИГРАТЬ СНОВА</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        let width = 400, height = 700, gameActive = false, score = 0;
        let owl = { x: 90, y: 260, radius: 25, vy: 0, gravity: 0.25, jump: -5.0 };
        let pipes = [];

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawOwl() {
            ctx.save();
            ctx.translate(owl.x, owl.y);
            // Тело совы
            ctx.fillStyle = '#782CE9';
            ctx.beginPath(); ctx.arc(0, 0, owl.radius, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#1D0542'; ctx.stroke();
            // Глаза
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(6, -4, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#140326';
            ctx.beginPath(); ctx.arc(8, -4, 3, 0, Math.PI * 2); ctx.fill();
            // Клюв
            ctx.fillStyle = '#FE7600';
            ctx.beginPath(); ctx.moveTo(14, -1); ctx.lineTo(20, 2); ctx.lineTo(14, 5); ctx.fill();
            ctx.restore();
        }

        function update() {
            if (!gameActive) return;
            owl.vy += owl.gravity;
            owl.y += owl.vy;

            if (owl.y + owl.radius > height || owl.y - owl.radius < 0) {
                gameActive = false;
                document.getElementById('gameOverModal').classList.remove('hidden');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#140326'; ctx.fillRect(0, 0, width, height);
            drawOwl();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('topHud').classList.remove('hidden');
            gameActive = true;
            owl.y = height / 2;
            owl.vy = 0;
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOverModal').classList.add('hidden');
            gameActive = true;
            owl.y = height / 2;
            owl.vy = 0;
            score = 0;
        });

        container.addEventListener('pointerdown', () => {
            if (gameActive) owl.vy = owl.jump;
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
